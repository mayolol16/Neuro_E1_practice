<svg xmlns="http://www.w3.org/2000/svg" width="460" height="240" viewBox="0 0 460 240"><rect width="460" height="240" fill="#f8fafc"/><text x="230" y="22" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Cranial Nerve VII: UMN vs. LMN Facial Palsy</text><rect x="25" y="40" width="195" height="185" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="122" y="60" font-family="Arial" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">UMN Lesion (Stroke)</text><text x="122" y="76" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">Motor Cortex / Corticobulbar</text><circle cx="122" cy="130" r="42" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><line x1="105" y1="104" x2="139" y2="104" stroke="#059669" stroke-width="2"/><line x1="108" y1="109" x2="136" y2="109" stroke="#059669" stroke-width="2"/><text x="122" y="100" font-family="Arial" font-size="9" font-weight="bold" fill="#059669" text-anchor="middle">FOREHEAD SPARED</text><ellipse cx="108" cy="122" rx="5" ry="3" fill="#1e293b"/><ellipse cx="136" cy="122" rx="5" ry="3" fill="#1e293b"/><path d="M 108 152 Q 120 152 136 160" fill="none" stroke="#b91c1c" stroke-width="3"/><text x="122" y="185" font-family="Arial" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">Contralateral lower mouth droops</text><text x="122" y="202" font-family="Arial" font-size="9" fill="#475569" text-anchor="middle">Bilateral UMN input to upper face</text><rect x="240" y="40" width="195" height="185" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="337" y="60" font-family="Arial" font-size="13" font-weight="bold" fill="#4338ca" text-anchor="middle">LMN Lesion (Bell's Palsy)</text><text x="337" y="76" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">CN VII Nucleus or Nerve</text><circle cx="337" cy="130" r="42" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><line x1="318" y1="106" x2="334" y2="106" stroke="#475569" stroke-width="1.5"/><text x="352" y="106" font-family="Arial" font-size="8" fill="#dc2626">No wrinkles</text><ellipse cx="323" cy="122" rx="5" ry="3" fill="#1e293b"/><ellipse cx="351" cy="122" rx="6" ry="6" fill="none" stroke="#dc2626" stroke-width="2"/><circle cx="351" cy="122" r="3" fill="#dc2626"/><path d="M 323 152 Q 335 152 351 160" fill="none" stroke="#dc2626" stroke-width="3"/><text x="337" y="185" font-family="Arial" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">ENTIRE half of face paralyzed</text><text x="337" y="202" font-family="Arial" font-size="9" fill="#475569" text-anchor="middle">Inability to close eye or furrow brow</text></svg>