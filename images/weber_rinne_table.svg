<svg xmlns="http://www.w3.org/2000/svg" width="460" height="230" viewBox="0 0 460 230"><rect width="460" height="230" fill="#fdfaf7"/><text x="230" y="24" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Tuning Fork Tests: Weber &amp; Rinne Patterns</text><rect x="20" y="42" width="420" height="30" fill="#0284c7" rx="3"/><text x="100" y="62" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Condition</text><text x="235" y="62" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Weber Test (512 Hz)</text><text x="365" y="62" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Rinne Test</text><rect x="20" y="74" width="420" height="42" fill="#ffffff" stroke="#e2e8f0"/><text x="100" y="99" font-family="Arial" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Normal</text><text x="235" y="99" font-family="Arial" font-size="11" fill="#475569" text-anchor="middle">Midline (No lateralization)</text><text x="365" y="99" font-family="Arial" font-size="11" fill="#16a34a" text-anchor="middle">AC &gt; BC both ears (+)</text><rect x="20" y="118" width="420" height="46" fill="#f8fafc" stroke="#e2e8f0"/><text x="100" y="141" font-family="Arial" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">Conductive Loss</text><text x="100" y="155" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">(e.g. Left ear)</text><text x="235" y="145" font-family="Arial" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">Lateralizes to AFFECTED ear</text><text x="365" y="141" font-family="Arial" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">BC &gt; AC in affected ear (-)</text><text x="365" y="155" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">(AC &gt; BC in normal ear)</text><rect x="20" y="166" width="420" height="46" fill="#ffffff" stroke="#e2e8f0"/><text x="100" y="189" font-family="Arial" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">Sensorineural Loss</text><text x="100" y="203" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">(e.g. Left ear)</text><text x="235" y="193" font-family="Arial" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">Lateralizes to NORMAL ear</text><text x="365" y="189" font-family="Arial" font-size="11" fill="#2563eb" text-anchor="middle">AC &gt; BC both ears (+)</text><text x="365" y="203" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">(Reduced duration affected)</text></svg>