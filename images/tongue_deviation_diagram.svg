<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210"><rect width="440" height="210" fill="#fdfbf7"/><text x="220" y="22" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Hypoglossal Nerve (CN XII) Lesions: Tongue Deviation</text><rect x="25" y="42" width="185" height="152" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="117" y="62" font-family="Arial" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">LMN Lesion (CN XII Nerve)</text><circle cx="117" cy="115" r="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><path d="M 112 110 Q 95 130 85 136 Q 95 142 112 130 Z" fill="#f87171" stroke="#dc2626" stroke-width="2"/><text x="117" y="162" font-family="Arial" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">Deviates IPSILATERAL</text><text x="117" y="178" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">With atrophy &amp; fasciculations</text><text x="117" y="190" font-family="Arial" font-size="9" fill="#0f172a" text-anchor="middle">("Tongue licks the lesion")</text><rect x="230" y="42" width="185" height="152" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="322" y="62" font-family="Arial" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">UMN Lesion (Cortex/Capsule)</text><circle cx="322" cy="115" r="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><path d="M 327 110 Q 344 130 354 136 Q 344 142 327 130 Z" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/><text x="322" y="162" font-family="Arial" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">Deviates CONTRALATERAL</text><text x="322" y="178" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">NO atrophy or fasciculations</text><text x="322" y="190" font-family="Arial" font-size="9" fill="#0f172a" text-anchor="middle">(Away from cortex stroke)</text></svg>